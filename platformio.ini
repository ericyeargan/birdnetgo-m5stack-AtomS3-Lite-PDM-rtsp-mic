; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-atoms3-lite]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
extra_scripts = pre:scripts/git_version.py
build_flags =
    -DCORE_DEBUG_LEVEL=4
    ; Keep optional dependency probes quiet while building against Arduino-ESP32 3.x / ESP-IDF 5.x.
    -Wno-cpp
lib_deps =
    tzapu/WiFiManager @ ^2.0.17

[env:m5stack-atoms3-lite-ota]
extends = env:m5stack-atoms3-lite
upload_protocol = espota
upload_port = atoms3mic.local
upload_flags =
    --port=3232

; Adafruit SPH0645LM4H I2S breakout instead of the Unit Mini PDM
; (BCLK=G5, LRCL=G6, DOUT=G7, SEL=GND; see include/MicConfig.h).
[env:m5stack-atoms3-lite-sph0645]
extends = env:m5stack-atoms3-lite
build_flags =
    ${env:m5stack-atoms3-lite.build_flags}
    -DMIC_SPH0645=1

[env:m5stack-atoms3-lite-sph0645-ota]
extends = env:m5stack-atoms3-lite-sph0645
upload_protocol = espota
upload_port = atoms3mic.local
upload_flags =
    --port=3232
